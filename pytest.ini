[pytest]
minversion = 6.0
addopts = 
    -ra
    -v
    --strict-markers
    --tb=short
testpaths = tests

# Custom test markers
markers =
    unit: quick unit tests
    integration: integration tests
    flaky: tests that may fail intermittently (use --run-flaky to run)
    slow: tests that take longer to run
    impact(files): mark test as impacted by given files or symbols (for test optimization)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options (if pytest-cov is installed)
# [tool:pytest]
# addopts = --cov=app --cov-report=html --cov-report=term

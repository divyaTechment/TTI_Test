[pytest]
minversion = 7.2.0
addopts = 
    -ra
    -v
    --strict-markers
    --tb=short
testpaths = tests

# Custom test markers
markers =
    unit: quick unit tests
    integration: integration tests
    flaky: tests that may fail intermittently (use --run-flaky to run)
    slow: tests that take longer to run
    impact(files): mark test as impacted by given files or symbols (for test optimization)

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Note: Coverage is handled by Datadog TIA directly
# Do not use pytest-cov as it's incompatible with TIA